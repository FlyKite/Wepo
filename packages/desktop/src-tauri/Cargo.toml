[package]
name = "wepo-assistant"
version = "1.0.0"
description = "Wepo 微仓 Tauri 桌面客户端"
authors = ["FlyKite"]
edition = "2021"

[lib]
name = "wepo_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
open = "5"
